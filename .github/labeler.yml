codec:
  # a file must match every glob: inside inkhue/ but not the updater
  - changed-files: [{ all-globs-to-any-file: ["inkhue/*.py", "!inkhue/updater.py"] }]
app:
  - changed-files: [{ any-glob-to-any-file: ["inkhue/gui/**", "packaging/**", "assets/**"] }]
refiner:
  - changed-files: [{ any-glob-to-any-file: ["inkhue/refiner*.py", "models/**", "scripts/train.py", "scripts/make_dataset.py"] }]
updater:
  - changed-files: [{ any-glob-to-any-file: ["inkhue/updater.py"] }]
ci:
  - changed-files: [{ any-glob-to-any-file: [".github/**"] }]
documentation:
  - changed-files: [{ any-glob-to-any-file: ["*.md", "assets/*.png"] }]
format-change:
  - changed-files: [{ any-glob-to-any-file: ["inkhue/payload.py", "inkhue/halftone.py", "inkhue/layout.py", "tests/test_format.py"] }]
