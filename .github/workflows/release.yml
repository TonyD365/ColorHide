# Builds the desktop app for every platform when a GitHub Release is published and attaches the
# installers to that release: macOS .pkg (-> /Applications), Windows setup.exe, Linux .deb.
# Each installer is installed on the runner and the installed app self-tests before upload.
# The release tag (e.g. v1.0.0) becomes the app version. Installed apps update themselves from
# whichever release is marked "Latest", using these same installers.
name: Release builds

on:
  release:
    types: [published]
  # CI calls this for pull requests that touch packaging: build, install and self-test every
  # installer, publish nothing (see the "Installers" job in ci.yml)
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write       # upload release assets
  id-token: write       # build provenance attestation
  attestations: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || format('v0.0.0-pr{0}', github.event.number) }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  PYTHON: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
      - run: pip install numpy opencv-python-headless reedsolo onnxruntime pytest
      - run: pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: windows-x64 }
          - { os: ubuntu-22.04, key: linux-x64 }
          - { os: macos-15, key: macos-arm64 }
          - { os: macos-15-intel, key: macos-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}

      - name: Stamp version from tag
        run: |
          printf '__version__ = "%s"  # set by CI from the release tag\n' "${TAG#v}" > inkhue/_version.py
          cat inkhue/_version.py

      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt pyinstaller

      - name: Build
        run: pyinstaller packaging/Inkhue.spec --noconfirm

      - name: Self-test the packaged app (encode, simulated print+scan, neural decode)
        run: |
          case "$RUNNER_OS" in
            macOS)   APP=dist/Inkhue.app/Contents/MacOS/Inkhue ;;
            Windows) APP=dist/Inkhue/Inkhue.exe ;;
            *)       APP=dist/Inkhue/Inkhue ;;
          esac
          "$APP" --self-test && echo "self-test passed"

      - name: Installer (macOS .pkg -> /Applications)
        if: runner.os == 'macOS'
        run: |
          # free ad-hoc signature (no Apple Developer account); users approve the installer once in
          # System Settings > Privacy & Security > Open Anyway
          codesign --force --deep --sign - dist/Inkhue.app
          KEY="${{ matrix.key }}"
          packaging/macos/build_pkg.sh "$TAG" "${KEY#macos-}"
          echo "ASSET=Inkhue-$TAG-$KEY.pkg" >> "$GITHUB_ENV"

      - name: Installer (Linux .deb -> /opt/Inkhue)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/build_deb.sh "$TAG"
          echo "ASSET=Inkhue-$TAG-linux-x64.deb" >> "$GITHUB_ENV"

      - name: Installer (Windows setup.exe, Inno Setup)
        if: runner.os == 'Windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" //Q "//DAppVersion=${TAG#v}" "//DTag=$TAG" packaging/windows/Inkhue.iss
          echo "ASSET=Inkhue-$TAG-windows-x64-setup.exe" >> "$GITHUB_ENV"

      # Optional free Windows code signing through SignPath Foundation (open-source projects).
      # Runs only once the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable are set.
      - name: Upload unsigned Windows build for signing
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: ${{ env.ASSET }}
      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Inkhue
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use signed Windows build
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: mv -f "signed/$ASSET" "$ASSET"

      - name: Install it for real, then self-test the installed app (macOS)
        if: runner.os == 'macOS'
        run: |
          test -f "$ASSET"
          sudo installer -pkg "$ASSET" -target /
          /Applications/Inkhue.app/Contents/MacOS/Inkhue --self-test && echo "installed app OK"

      - name: Install it for real, then self-test the installed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./$ASSET"
          test -f /usr/share/applications/inkhue.desktop
          /opt/Inkhue/Inkhue --self-test && echo "installed app OK"

      - name: Install it for real, then self-test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\$env:ASSET" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Inkhue\Inkhue.exe"
          $t = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "installed app self-test failed ($($t.ExitCode))" }
          "installed app OK"

      - name: Keep the installer as a workflow artifact (pull requests)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          retention-days: 7

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload to release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "${{ github.repository }}"

  checksums:
    # uploaded last on purpose: the in-app updater only offers a release once this file exists
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'Inkhue-*' --dir dl
          cd dl && sha256sum Inkhue-* > ../SHA256SUMS.txt && cd ..
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
