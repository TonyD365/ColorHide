name: Print / scan report
description: Share how ColorHide did with your real printer and scanner
title: "[report] <printer> + <scanner>"
labels: [real-world-test]
body:
  - type: input
    id: printer
    attributes: { label: Printer (model, laser/inkjet, dpi used) }
    validations: { required: true }
  - type: input
    id: scanner
    attributes: { label: Scanner (model, dpi, color mode) }
    validations: { required: true }
  - type: dropdown
    id: result
    attributes:
      label: Did the color come back?
      options: ["Yes, looks right", "Yes, but damaged / noisy", "No — page not found", "No — other error"]
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: ColorHide version and OS }
  - type: textarea
    id: notes
    attributes:
      label: Notes and images
      description: The LCD message, settings you changed, and if you can, the scan and the recovered image.
