name: Bug report
description: Something in the app or the codec is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: ColorHide version and OS }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
