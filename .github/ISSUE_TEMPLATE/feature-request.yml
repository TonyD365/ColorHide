name: ✨ Feature request
description: Suggest something ColorHide should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Tell us the problem first — there may be more than one way to solve it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      placeholder: When I …, I want to …, so that …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [App / UI, Printing, Scanning, Codec / image quality, Neural refiner, Installing & updates, Other]
